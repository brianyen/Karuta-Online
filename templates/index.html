<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Karuta Player</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/index.css') }}">
  </head>
  <body>
    <h1 id="title">Karuta</h1>
    <div id="create-div">
    <select id="playlistSelect"></select>
    <button id="create-room" onclick="sendCreateRequest()">Create a Room</button>
    </div>
    <div id="join-div">
    <input type="text" id="room-code-input" placeholder="Enter a Room Code"/>
    <button id="join-room" onclick="sendJoinRequest()">Join a Room</button>
    </div>
    <script src="{{ url_for('static', filename='scripts/index.js') }}"></script>
  </body>
</html>
